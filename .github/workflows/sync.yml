name: Sync SDK Feature Matrix from Notion

on:
  schedule:
    - cron: "0 6 * * *"   # tous les jours à 06:00 UTC
  workflow_dispatch: {}    # bouton "Run workflow" pour forcer une sync à la demande

permissions:
  contents: write          # autorise le commit du JSON régénéré

concurrency:
  group: sync-notion
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate octo-features.json from Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: node sync/sync-notion.mjs

      - name: Commit changes if any
        run: |
          if [[ -n "$(git status --porcelain octo-features.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add octo-features.json
            git commit -m "chore: sync SDK feature matrix from Notion"
            git push
          else
            echo "No changes to commit."
          fi
